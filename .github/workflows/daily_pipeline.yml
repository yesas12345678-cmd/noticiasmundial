name: Pipeline Editorial Diario - Noticias Mundial

on:
  schedule:
    # Se ejecuta todos los días a las 02:00 AM UTC (4:00 AM hora de España en verano, 3:00 AM en invierno)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Permite ejecutar el flujo manualmente desde la interfaz de GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Pipeline de Artículos con DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generateDailyPipeline.mjs
